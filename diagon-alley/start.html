<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computing Open Day Launchpad</title>
    <style>
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(circle, #2a2a35 0%, #101015 100%);
            color: #d4c4a8;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 50px;
            color: #bdc3c7;
        }

        .button-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px; /* Widened slightly to fit three buttons nicely */
        }

        .launch-btn {
            background-color: #2c3e50;
            color: #d4c4a8;
            text-decoration: none;
            padding: 30px 20px; /* Adjusted padding to balance the layout */
            font-size: 1.5rem;
            border-radius: 15px;
            border: 3px solid #4a3525;
            transition: all 0.3s ease;
            width: 250px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .launch-btn:hover {
            background-color: #f1c40f;
            color: #1a1a1a;
            border-color: #f1c40f;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(241, 196, 15, 0.4);
        }

        .launch-btn span {
            display: block;
            font-size: 1rem;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Welcome to Computing</h1>
    <p>Select a portal to begin your magical journey into web development.</p>

    <div class="button-container">
        <!-- Target="_blank" opens the links in a new tab so the launchpad stays open -->
        
        <a href="index.html" target="_blank" class="launch-btn">
            🪄 Wand Selector
            <span>Launch the student coding activity</span>
        </a>

        <!-- ⚠️ NEW: Link to the Typing Exam -->
        <a href="index_2.html" target="_blank" class="launch-btn">
            📜 O.W.L. Typing Exam
            <span>Take the magical typing speed test</span>
        </a>

        <a href="dashboard.html" target="_blank" class="launch-btn">
            📊 Live Dashboard
            <span>View real-time Open Day stats</span>
        </a>
    </div>

</body>
</html>
