<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ollivanders' Daily Ledger Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@latest/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif; 
            background-color: #2c3e50; 
            color: #ecf0f1; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            overflow-x: hidden;
        }
        .school-logo {
            max-width: 450px; 
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        .dashboard-layout {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 15px;
            text-align: left;
        }
        .left-column, .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }
        .stat-box {
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .stat-box h2 {
            color: #f1c40f;
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }
        .stat-box .count-text { font-size: 1.4rem; }
        .content-box { 
            background-color: #34495e; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative; 
        }
        .chart-box { height: 320px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #7f8c8d;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: #f1c40f;
            font-size: 1.05rem;
        }
        tr:nth-child(even) { background-color: #2c3e50; }
        
        /* =========================================
           🪄 MODERATION DRAWER STYLES
           ========================================= */
        #moderation-drawer {
            position: fixed;
            top: 0;
            right: -500px; 
            width: 500px;
            max-width: 100vw;
            height: 100%;
            background: #1e2b3c;
            color: #fff;
            transition: right 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 20px;
            text-align: left;
        }
        
        #moderation-drawer.open {
            right: 0;
        }
        
        #drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1c40f;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        #drawer-header h3 { 
            margin: 0; 
            font-size: 20px; 
            color: #f1c40f; 
        }
        
        .drawer-table-container {
            flex-grow: 1;
            overflow-y: auto;
        }

        #toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 16px;
            padding: 15px 25px;
            border: 2px solid #f1c40f;
            background-color: #d4af37;
            color: #2c3e50;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        #toggle-btn:hover { background-color: #f1c40f; }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .close-btn:hover { background: #c0392b; }

    </style>
</head>
<body>
    
    <img src="Delta_Laurel_HP.jpg" alt="Delta The Laurel Academy Logo" class="school-logo">

    <div class="dashboard-layout">
        
        <!-- Left Column: Wand Stats -->
        <div class="left-column">
            <div class="stat-box">
                <h2>Ollivanders' Open Day Statistics</h2>
                <div class="count-text" id="totalCount">Loading wands...</div>
            </div>

            <div class="content-box chart-box"><canvas id="coreChart"></canvas></div>
            <div class="content-box chart-box"><canvas id="flexChart"></canvas></div>
        </div>

        <!-- Right Column: Typing Stats -->
        <div class="right-column">
            <div class="stat-box">
                <h2>🏆 O.W.L. Typing Exam 🏆</h2>
                <div class="count-text" id="totalExams">Loading exams...</div>
            </div>
            
            <div class="content-box">
                <h3 style="text-align: center; color: #ecf0f1; margin-top: 0;">Top 10 Highscores</h3>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 10%;">Rank</th>
                            <th style="width: 30%;">Wizard Name</th>
                            <th style="width: 15%;">Speed (WPM)</th>
                            <th style="width: 15%;">Accuracy</th>
                            <th style="width: 20%;">Time (s)</th>
                            <th style="width: 10%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="highscore-body">
                        <tr><td colspan="6">Waiting for first typist...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- =========================================
         🪄 HIDDEN MODERATION DRAWER 
         ========================================= -->
    
    <button id="toggle-btn">🪄 Edit Wands</button>

    <div id="moderation-drawer">
        <div id="drawer-header">
            <h3>Recent Wand Entries</h3>
            <button class="close-btn" id="close-btn">✖ Close</button>
        </div>
        
        <div class="drawer-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Wood</th>
                        <th>Core</th>
                        <th>Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recent-wands-body">
                    <tr><td colspan="4">Loading recent wands...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- =========================================
         📊 DASHBOARD SCRIPTS
         ========================================= -->
    <script>
        let coreChartInst, flexChartInst;

        async function loadDashboard() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch(`wands_ledger.jsonl?t=${cacheBuster}`);
                
                if (!response.ok) return;

                const text = await response.text();
                const wands = text.split('\n')
                                  .filter(line => line.trim() !== '')
                                  .map(line => JSON.parse(line));

                document.getElementById('totalCount').innerHTML = `Total Wands Chosen Today: <strong>${wands.length}</strong>`;

                const coreCounts = {};
                const flexCounts = {};

                wands.forEach(wand => {
                    coreCounts[wand.core] = (coreCounts[wand.core] || 0) + 1;
                    flexCounts[wand.flexibility] = (flexCounts[wand.flexibility] || 0) + 1;
                });

                const coreCtx = document.getElementById('coreChart').getContext('2d');
                if (coreChartInst) coreChartInst.destroy();
                coreChartInst = new Chart(coreCtx, {
                    type: 'pie',
                    data: {
                        labels: Object.keys(coreCounts),
                        datasets: [{ data: Object.values(coreCounts), backgroundColor: ['#e74c3c', '#3498db', '#f1c40f'] }]
                    },
                    options: { 
                        maintainAspectRatio: false, 
                        plugins: { title: { display: true, text: 'Most Popular Cores', color: '#fff' }, legend: { labels: { color: '#ecf0f1' } } } 
                    }
                });

                const flexCtx = document.getElementById('flexChart').getContext('2d');
                if (flexChartInst) flexChartInst.destroy();
                flexChartInst = new Chart(flexCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(flexCounts),
                        datasets: [{ label: 'Wands', data: Object.values(flexCounts), backgroundColor: '#e67e22' }]
                    },
                    options: { 
                        maintainAspectRatio: false, 
                        plugins: { title: { display: true, text: 'Flexibility Distribution', color: '#fff' }, legend: { display: false } }, 
                        scales: { y: { ticks: { color: '#ecf0f1', stepSize: 1 } }, x: { ticks: { color: '#ecf0f1' } } } 
                    }
                });

                // Populate the hidden moderation drawer
                const wandBody = document.getElementById('recent-wands-body');
                wandBody.innerHTML = '';
                const recentWands = [...wands].reverse().slice(0, 15); // Increased to top 15 for moderation

                recentWands.forEach(wand => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${wand.wood}</td>
                        <td>${wand.core}</td>
                        <td style="font-size: 0.85rem;">${wand.generated_at}</td>
                        <td><button onclick="deleteWand('${wand.generated_at}')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" title="Banish this wand">❌</button></td>
                    `;
                    wandBody.appendChild(tr);
                });

            } catch (error) {
                console.error("No wand data yet or error fetching:", error);
            }
        }

        async function loadHighscores() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch(`diagon_alley_scores.jsonl?t=${cacheBuster}`);
                
                if (!response.ok) return;

                const text = await response.text();
                const scores = text.split('\n')
                                   .filter(line => line.trim() !== '')
                                   .map(line => JSON.parse(line));
                
                document.getElementById('totalExams').innerHTML = `Total Exams Taken: <strong>${scores.length}</strong>`;

                scores.sort((a, b) => b.wpm - a.wpm);
                
                const tbody = document.getElementById('highscore-body');
                tbody.innerHTML = '';
                
                if (scores.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">Waiting for first typist...</td></tr>';
                    return;
                }

                scores.slice(0, 10).forEach((score, index) => {
                    const tr = document.createElement('tr');
                    
                    let rankStyle = "";
                    if (index === 0) rankStyle = "color: #f1c40f; font-weight: bold; font-size: 1.1rem;";
                    else if (index === 1) rankStyle = "color: #bdc3c7; font-weight: bold;";
                    else if (index === 2) rankStyle = "color: #cd7f32; font-weight: bold;";
                    
                    const accuracyText = score.accuracy !== undefined ? `${score.accuracy}%` : 'N/A';
                    
                    tr.innerHTML = `
                        <td style="${rankStyle}">${index + 1}</td>
                        <td>${score.name}</td>
                        <td style="font-weight: bold;">${score.wpm}</td>
                        <td>${accuracyText}</td>
                        <td>${score.time_seconds}</td>
                        <td><button onclick="deleteScore('${score.timestamp}')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" title="Banish this record">❌</button></td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("No typing score data yet or error fetching:", error);
            }
        }

        async function deleteScore(timestamp) {
            if (confirm("Are you sure you want to banish this typing record?")) {
                try {
                    await fetch('delete_score.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ timestamp: timestamp })
                    });
                    loadHighscores(); 
                } catch (error) {
                    console.error("Error deleting score:", error);
                }
            }
        }

        async function deleteWand(generated_at) {
            if (confirm("Are you sure you want to banish this wand entry?")) {
                try {
                    await fetch('delete_wand.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ generated_at: generated_at })
                    });
                    loadDashboard(); 
                } catch (error) {
                    console.error("Error deleting wand:", error);
                }
            }
        }

        // Start Dashboard Loops
        loadDashboard();
        loadHighscores();
        setInterval(() => {
            loadDashboard();
            loadHighscores();
        }, 5000);

        // --- Drawer Toggle Logic ---
        const drawer = document.getElementById('moderation-drawer');
        const toggleBtn = document.getElementById('toggle-btn');
        const closeBtn = document.getElementById('close-btn');

        toggleBtn.addEventListener('click', () => {
            drawer.classList.add('open');
            toggleBtn.style.display = 'none'; 
        });

        closeBtn.addEventListener('click', () => {
            drawer.classList.remove('open');
            toggleBtn.style.display = 'block'; 
        });
    </script>
</body>
</html>
